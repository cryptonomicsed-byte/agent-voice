[project]
name = "agent-voice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "websockets>=14.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    # aiortc pulled in separately (heavy C deps)
    # agent-phone: pip install git+https://github.com/cryptonomicsed-byte/agent-phone.git
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
