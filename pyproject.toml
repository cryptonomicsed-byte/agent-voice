[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agent-voice"
version = "0.1.0"
description = "Sovereign Nostr-signaled WebRTC voice endpoint"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.9.0",
    "websockets>=14.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "webrtcvad>=2.0.10",
    "av>=12.0.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
