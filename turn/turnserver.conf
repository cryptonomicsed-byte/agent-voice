# coturn TURN server config (GAP-5)
# Self-host on Hostinger or the box. Required for NAT traversal
# when both caller and agent are behind symmetric NAT.

listening-port=3478
# external-ip=<PUBLIC_IP>
# realm=<DOMAIN>

# Credentials: use long-term mechanism, secrets in vault
# user=<TURN_USER>:<TURN_PASS>

# Relay ports
min-port=49160
max-port=49200

# Logging
log-file=/var/log/turnserver.log
verbose
