# coturn config for agent-voice TURN server
# Deploy: /etc/turnserver.conf  (or pass with --conf flag)
#
# Install: apt-get install coturn
# Enable:  echo "TURNSERVER_ENABLED=1" >> /etc/default/coturn
# Start:   systemctl enable --now coturn
#
# Required before deploy (replace inline or use envsubst):
#   TURN_HOST   — public IP or FQDN  (e.g. omokoda.duckdns.org)
#   TURN_SECRET — shared secret also set in turn_creds.py / Vantage env
#                 generate: python3 -c "import secrets; print(secrets.token_hex(32))"

# ── Network ────────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# Uncomment and set to your VPS public IP (required on multi-homed hosts)
# external-ip=REPLACE_WITH_VPS_IP

# Optional TLS (recommended if running on a domain with a cert):
# cert=/etc/letsencrypt/live/omokoda.duckdns.org/fullchain.pem
# pkey=/etc/letsencrypt/live/omokoda.duckdns.org/privkey.pem

# ── HMAC short-term credentials (RFC 5766) ─────────────────────────────────────
# turn_creds.py generates username/password on the fly using this secret.
# coturn verifies them here — no static user list needed.
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SECRET

realm=omokoda.duckdns.org

# ── Relay port range ───────────────────────────────────────────────────────────
min-port=49160
max-port=49200

# ── Security ───────────────────────────────────────────────────────────────────
no-multicast-peers
# Block relay to RFC-1918 private ranges (prevents SSRF through TURN)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# ── Logging ────────────────────────────────────────────────────────────────────
log-file=/var/log/turnserver.log
verbose
